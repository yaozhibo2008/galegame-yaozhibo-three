<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0e1c">
<title>恋爱模拟器 · 选角大厅</title>
<style>
/* ==================================================================
   全局基础
   ================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:#0b0e1c;color:#fff;overflow:hidden;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font-family:inherit;}

/* ==================================================================
   选角大厅
   ================================================================== */
#lobby{
  position:fixed;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:40;
  background:
    radial-gradient(80% 55% at 12% -5%, rgba(120,170,255,.30), transparent 62%),
    radial-gradient(70% 55% at 102% 18%, rgba(255,130,190,.26), transparent 62%),
    radial-gradient(95% 65% at 50% 112%, rgba(150,120,255,.30), transparent 62%),
    linear-gradient(180deg,#101429 0%,#0b0e1c 55%,#080a14 100%);
}
#lobby.on{display:block;}
#lobby::before{
  content:"";position:fixed;inset:-25%;pointer-events:none;
  background:
    radial-gradient(circle at 22% 32%, rgba(140,180,255,.35), transparent 42%),
    radial-gradient(circle at 78% 62%, rgba(255,140,200,.30), transparent 42%),
    radial-gradient(circle at 55% 12%, rgba(180,160,255,.26), transparent 40%);
  filter:blur(46px);
  animation:lobbyFloat 18s ease-in-out infinite alternate;
}
@keyframes lobbyFloat{
  0%{transform:translate(-3%,-2%) scale(1);}
  100%{transform:translate(3%,3%) scale(1.1);}
}
#lobby::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 78% 12%, #cfe0ff, transparent),
    radial-gradient(1.2px 1.2px at 34% 72%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 88% 62%, #ffd9ef, transparent),
    radial-gradient(1.2px 1.2px at 62% 86%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 8% 88%, #cbb6ff, transparent),
    radial-gradient(1.2px 1.2px at 46% 34%, #fff, transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25;}to{opacity:.75;}}

.lobby-inner{
  position:relative;z-index:2;min-height:100%;
  padding:calc(34px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;text-align:center;
}
.lobby-head{animation:lobbyRise .7s cubic-bezier(.2,.8,.3,1) both;}
.lobby-badge{
  display:inline-block;font-size:10px;letter-spacing:.42em;color:#93a8d6;
  padding:5px 15px 5px 18px;border-radius:99px;
  border:1px solid rgba(147,168,214,.32);background:rgba(147,168,214,.08);
  margin-bottom:16px;
}
.lobby-title{
  font-size:clamp(26px,7vw,36px);font-weight:800;letter-spacing:.16em;line-height:1.2;
  background:linear-gradient(115deg,#d5e4ff 8%,#ffd3e8 48%,#cbb6ff 92%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(160,150,255,.35));
}
.lobby-subtitle{margin-top:12px;font-size:12.5px;letter-spacing:.16em;color:#8891b4;}

.cards{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;width:100%;max-width:700px;
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr;max-width:380px;gap:14px;}
}

.char-card{
  position:relative;overflow:hidden;cursor:pointer;text-align:left;color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:22px 18px 18px;border-radius:24px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 44px rgba(0,0,0,.42);
  transition:transform .26s cubic-bezier(.2,.8,.3,1),border-color .26s,box-shadow .3s;
  animation:cardRise .7s cubic-bezier(.2,.8,.3,1) both;
}
.char-card:nth-child(1){animation-delay:.10s;}
.char-card:nth-child(2){animation-delay:.22s;}
@keyframes cardRise{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes lobbyRise{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:none;}}

.char-card::before{
  content:"";position:absolute;top:-72px;right:-64px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,var(--acc),transparent 68%);
  opacity:.34;filter:blur(18px);pointer-events:none;transition:opacity .3s;
}
.char-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 42%);
}
.char-card[data-game="yzg"]{--acc:#8fc4ff;--acc2:#cfe6ff;}
.char-card[data-game="yzb"]{--acc:#ff9dc4;--acc2:#d9b8ff;}
.char-card:active{transform:scale(.975);}
@media (hover:hover){
  .char-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.30);
    box-shadow:0 26px 54px rgba(0,0,0,.5),0 0 0 1px var(--acc) inset;}
  .char-card:hover::before{opacity:.55;}
}

.char-avatar{
  position:relative;z-index:1;width:112px;height:112px;border-radius:50%;overflow:hidden;
  background:#0f1326;margin-bottom:16px;
  box-shadow:0 14px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.14), 0 0 26px -6px var(--acc);
}
.char-avatar svg{display:block;width:100%;height:100%;}
.char-name{position:relative;z-index:1;font-size:19px;font-weight:800;letter-spacing:.08em;}
.char-name em{
  font-style:normal;font-size:10.5px;font-weight:500;letter-spacing:.18em;
  color:var(--acc);margin-left:7px;vertical-align:2px;
}
.char-slogan{
  position:relative;z-index:1;margin-top:9px;font-size:12.5px;line-height:1.85;
  color:#a9b2d0;min-height:46px;
}
.char-tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.char-tags i{
  font-style:normal;font-size:10.5px;letter-spacing:.1em;padding:4px 10px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);color:#c7cfe8;
}
.char-enter{
  position:relative;z-index:1;margin-top:16px;font-size:11.5px;letter-spacing:.26em;
  color:var(--acc);padding:8px 20px;border-radius:99px;
  border:1px solid color-mix(in srgb, var(--acc) 45%, transparent);
  background:color-mix(in srgb, var(--acc) 12%, transparent);
}
.lobby-foot{
  font-size:11px;letter-spacing:.12em;color:#6e7799;line-height:2;
  animation:lobbyRise .7s .35s cubic-bezier(.2,.8,.3,1) both;
}

/* ==================================================================
   游戏 A：姚智博（高冷正太线）  #yzg
   ================================================================== */
#yzg{position:fixed;inset:0;display:none;z-index:10;}
#yzg.on{display:block;}

#yzg .yzg-screen{
  position:absolute;inset:0;display:none;flex-direction:column;color:#2c3f56;
  background:
    radial-gradient(120% 80% at 10% 0%, #ffffff 0%, rgba(255,255,255,0) 55%),
    radial-gradient(100% 70% at 100% 100%, #d7e8fa 0%, rgba(215,232,250,0) 60%),
    linear-gradient(170deg,#f3f8fd 0%,#e2edf9 55%,#d8e6f6 100%);
}
#yzg .yzg-screen.active{display:flex;}

/* ---- 开始页 ---- */
#yzg .yzg-screen-start{overflow-y:auto;padding:24px;}
#yzg .yzg-start-card{
  margin:auto;width:100%;max-width:400px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(160,190,220,.5);border-radius:22px;
  padding:30px 24px 26px;box-shadow:0 18px 50px rgba(110,150,190,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:yzgFadeUp .55s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes yzgFadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
#yzg .yzg-brand{
  display:inline-block;font-size:11px;letter-spacing:.34em;color:#7fa3c8;margin-bottom:12px;
  padding:3px 12px;border-radius:99px;border:1px solid rgba(127,163,200,.4);
  background:rgba(127,163,200,.08);
}
#yzg .yzg-start-card h1{font-size:27px;font-weight:700;letter-spacing:.06em;color:#33506e;margin-bottom:8px;}
#yzg .yzg-start-card h1 span{color:#6f9dc9;}
#yzg .yzg-sub{font-size:12.5px;line-height:1.9;color:#8298b0;margin-bottom:24px;}
#yzg .yzg-lbl{display:block;font-size:12px;letter-spacing:.16em;color:#7c96b2;margin:0 0 9px 2px;}
#yzg .yzg-input-name{
  width:100%;padding:14px 16px;font-size:15px;font-family:inherit;color:#2c3f56;
  background:rgba(255,255,255,.9);border:1.5px solid #cfdff0;border-radius:14px;
  outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:20px;
}
#yzg .yzg-input-name::placeholder{color:#a9bccf;}
#yzg .yzg-input-name:focus{border-color:#8fb8de;box-shadow:0 0 0 4px rgba(143,184,222,.18);}
#yzg .yzg-gender-row{display:flex;gap:9px;margin-bottom:26px;}
#yzg .yzg-gender-btn{
  flex:1;padding:12px 0;font-size:13.5px;font-family:inherit;cursor:pointer;
  background:rgba(255,255,255,.75);border:1.5px solid #cfdff0;border-radius:13px;
  color:#6f8ba8;transition:all .2s;
}
#yzg .yzg-gender-btn.on{
  background:linear-gradient(160deg,#8fb8de,#6f9dc9);border-color:transparent;
  color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(111,157,201,.32);
}
#yzg .yzg-btn-main{
  width:100%;padding:16px;font-size:15.5px;font-family:inherit;font-weight:600;
  letter-spacing:.12em;color:#fff;cursor:pointer;border:none;border-radius:15px;
  background:linear-gradient(135deg,#8fb8de,#6f9dc9);
  box-shadow:0 10px 26px rgba(111,157,201,.32);
  transition:transform .14s,box-shadow .2s;
}
#yzg .yzg-btn-main:active{transform:scale(.975);}
#yzg .yzg-btn-ghost{
  width:100%;margin-top:11px;padding:14px;font-size:13.5px;font-family:inherit;
  cursor:pointer;border-radius:15px;color:#6f8ba8;
  background:rgba(255,255,255,.6);border:1.5px solid #d3e2f1;
  transition:all .2s;
}
#yzg .yzg-btn-ghost:active{background:#e6f0fa;}
#yzg .yzg-tip{margin-top:20px;font-size:11px;line-height:1.9;color:#9db1c6;text-align:center;}

/* ---- 游戏页 ---- */
#yzg .yzg-status{
  flex:0 0 auto;padding:12px 14px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(255,255,255,.72);
  border-bottom:1px solid rgba(170,198,224,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#yzg .yzg-stats{display:flex;gap:10px;}
#yzg .yzg-stat{flex:1;min-width:0;}
#yzg .yzg-stat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
#yzg .yzg-stat-name{font-size:10.5px;letter-spacing:.08em;color:#88a1ba;}
#yzg .yzg-stat-val{font-size:12px;font-weight:700;color:#42678c;}
#yzg .yzg-track{height:5px;border-radius:99px;background:#dce8f4;overflow:hidden;}
#yzg .yzg-fill{height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.3,.9,.3,1);}
#yzg #yzg-fill-fav{background:linear-gradient(90deg,#f7b8ce,#ec8fb4);}
#yzg #yzg-fill-dep{background:linear-gradient(90deg,#9fd6c4,#5fbfa3);}
#yzg #yzg-fill-cool{background:linear-gradient(90deg,#a9c9ea,#7ba6d4);}
#yzg .yzg-toolbar{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin-top:9px;}
#yzg .yzg-toolbar button{
  padding:6px 13px;font-size:11.5px;font-family:inherit;cursor:pointer;
  border-radius:99px;color:#7b97b4;background:rgba(255,255,255,.85);
  border:1px solid #d3e2f1;transition:all .18s;
}
#yzg .yzg-toolbar button:active{background:#dceafa;color:#4d7299;}
#yzg #yzg-btn-lobby{color:#6f9dc9;border-color:#bcd6ee;background:rgba(143,184,222,.14);}

#yzg .yzg-log{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 16px 8px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
}
#yzg .yzg-msg{margin-bottom:15px;animation:yzgMsgIn .35s ease both;}
@keyframes yzgMsgIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
#yzg .yzg-speaker{
  display:inline-block;font-size:11.5px;letter-spacing:.1em;color:#6f9dc9;
  padding:2px 0;margin-bottom:5px;font-weight:600;
}
#yzg .yzg-speaker::before{content:"—— ";}
#yzg .yzg-speaker-player{color:#8a9fb5;}
#yzg .yzg-line{
  font-size:15px;line-height:1.95;color:#37506b;word-break:break-word;letter-spacing:.01em;
}
#yzg .yzg-msg-narration .yzg-line{color:#6a8299;font-size:14.5px;}
#yzg .yzg-msg-dialog .yzg-line{color:#2f4a68;}
#yzg .yzg-msg-player{text-align:right;}
#yzg .yzg-msg-player .yzg-line{color:#5b7692;font-style:italic;}

#yzg .yzg-choices{
  flex:0 0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(to top,rgba(240,246,252,.98) 55%,rgba(240,246,252,0));
}
#yzg .yzg-choices:empty{display:none;}
#yzg .yzg-choice{
  width:100%;text-align:left;padding:14px 16px;font-size:14px;line-height:1.6;
  font-family:inherit;color:#3a5573;cursor:pointer;
  background:rgba(255,255,255,.92);border:1.5px solid #d6e4f2;border-radius:14px;
  box-shadow:0 3px 10px rgba(130,165,200,.10);
  transition:transform .14s,background .2s,border-color .2s,box-shadow .2s;
  animation:yzgChIn .32s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes yzgChIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
#yzg .yzg-choice:active{
  transform:scale(.985);background:#e8f2fc;border-color:#8fb8de;
  box-shadow:0 2px 6px rgba(130,165,200,.2);
}
#yzg .yzg-choice::before{content:"▸ ";color:#9fc0e0;}

/* ---- 结局页 ---- */
#yzg .yzg-screen-end{overflow-y:auto;padding:24px;}
#yzg .yzg-end-card{
  margin:auto;width:100%;max-width:420px;background:rgba(255,255,255,.86);
  border:1px solid rgba(160,190,220,.5);border-radius:22px;
  padding:32px 24px 26px;box-shadow:0 18px 50px rgba(110,150,190,.18);
  text-align:center;animation:yzgFadeUp .6s cubic-bezier(.2,.8,.3,1) both;
}
#yzg .yzg-end-tag{font-size:10.5px;letter-spacing:.5em;color:#9fbbd8;margin-bottom:14px;}
#yzg .yzg-end-card h2{font-size:24px;letter-spacing:.1em;color:#33506e;margin-bottom:20px;}
#yzg .yzg-end-text{font-size:14px;line-height:2.05;color:#4d6a87;text-align:left;margin-bottom:24px;}
#yzg .yzg-end-text p{margin-bottom:12px;}
#yzg .yzg-end-stats{
  display:flex;justify-content:center;gap:22px;margin-bottom:26px;
  padding-top:18px;border-top:1px dashed #d3e2f1;
}
#yzg .yzg-end-stat{font-size:11px;letter-spacing:.08em;color:#9db1c6;}
#yzg .yzg-end-stat b{display:block;font-size:19px;color:#5f8ab5;margin-top:5px;font-weight:700;}

#yzg .yzg-toast{
  position:absolute;left:50%;bottom:14%;transform:translate(-50%,8px);
  padding:9px 20px;border-radius:99px;font-size:13px;font-weight:600;
  background:rgba(111,157,201,.95);color:#fff;white-space:nowrap;
  opacity:0;pointer-events:none;transition:all .28s ease;z-index:99;
  box-shadow:0 8px 22px rgba(90,130,170,.3);
}
#yzg .yzg-toast.on{opacity:1;transform:translate(-50%,0);}
#yzg .yzg-log::-webkit-scrollbar{width:4px;}
#yzg .yzg-log::-webkit-scrollbar-thumb{background:#c9dcee;border-radius:99px;}

/* ==================================================================
   游戏 B：姚智博（傲娇学长线）  #yzb
   ================================================================== */
#yzb{position:fixed;inset:0;display:none;z-index:10;}
#yzb.on{display:block;}

#yzb .yzb-screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  background:
    radial-gradient(1000px 600px at 15% -10%, rgba(255,110,170,.20), transparent 60%),
    radial-gradient(900px 700px at 110% 20%, rgba(120,120,255,.18), transparent 60%),
    linear-gradient(180deg,#1b1028 0%,#120b1c 100%);
  color:#f3e9fb;
}
#yzb .yzb-screen.active{display:flex;}

/* ---- 开始界面 ---- */
#yzb .yzb-start-screen{overflow-y:auto;padding:22px;}
#yzb .yzb-start-card{
  margin:auto;width:100%;max-width:400px;padding:26px 22px 24px;border-radius:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  animation:yzbCardIn .5s ease both;
}
@keyframes yzbCardIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:none;}}
#yzb .yzb-title-badge{
  display:inline-block;font-size:11px;letter-spacing:3px;color:#ff9dc4;
  border:1px solid rgba(255,157,196,.45);border-radius:99px;padding:3px 10px;margin-bottom:12px;
}
#yzb .yzb-start-card h1{margin:0 0 8px;font-size:26px;letter-spacing:2px;}
#yzb .yzb-subtitle{margin:0 0 22px;font-size:13px;line-height:1.7;color:#b8a6c9;}
#yzb .yzb-field-label{display:block;font-size:12px;color:#c9b6da;margin:0 0 8px;letter-spacing:1px;}
#yzb .yzb-name-input{
  width:100%;padding:13px 14px;border-radius:12px;font-size:15px;font-family:inherit;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);color:#fff;outline:none;
  margin-bottom:18px;transition:border-color .2s;
}
#yzb .yzb-name-input:focus{border-color:#ff7fb0;}
#yzb .yzb-name-input::placeholder{color:rgba(255,255,255,.32);}
#yzb .yzb-gender-group{display:flex;gap:10px;margin-bottom:24px;}
#yzb .yzb-gender-btn{
  flex:1;padding:11px 0;border-radius:12px;font-size:14px;font-family:inherit;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#e6d8f2;
  transition:all .2s;
}
#yzb .yzb-gender-btn.active{
  background:linear-gradient(135deg,#ff7fb0,#ff5a95);border-color:transparent;
  color:#2a0d1b;font-weight:700;box-shadow:0 6px 18px rgba(255,90,149,.35);
}
#yzb .yzb-primary-btn{
  width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:700;
  letter-spacing:2px;font-family:inherit;cursor:pointer;color:#2a0d1b;
  background:linear-gradient(135deg,#ffa3c6,#ff6fa8);
  box-shadow:0 10px 26px rgba(255,110,168,.32);
  transition:transform .15s,box-shadow .2s;
}
#yzb .yzb-primary-btn:active{transform:scale(.98);box-shadow:0 6px 16px rgba(255,110,168,.3);}
#yzb .yzb-ghost-btn{
  width:100%;margin-top:12px;padding:13px;border-radius:14px;font-size:14px;font-family:inherit;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.22);color:#dccbea;
}
#yzb .yzb-hint{margin:16px 0 0;font-size:11.5px;color:#8f7ba3;text-align:center;line-height:1.7;}

/* ---- 游戏界面 ---- */
#yzb .yzb-topbar{
  flex:0 0 auto;padding:10px 12px 9px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(18,10,28,.72);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#yzb .yzb-stats{display:flex;gap:10px;}
#yzb .yzb-stat{flex:1;min-width:0;}
#yzb .yzb-stat-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#c6b3d8;margin-bottom:5px;}
#yzb .yzb-stat-head b{font-size:12px;color:#fff;}
#yzb .yzb-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;}
#yzb .yzb-bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);}
#yzb #yzb-bar-affection{background:linear-gradient(90deg,#ff9dc4,#ff4d8d);}
#yzb #yzb-bar-tsundere{background:linear-gradient(90deg,#a8c8ff,#6b8bff);}
#yzb #yzb-bar-trust{background:linear-gradient(90deg,#8ff0d0,#38c79a);}
#yzb .yzb-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:9px;}
#yzb .yzb-tools button{
  padding:5px 13px;border-radius:99px;font-size:11.5px;font-family:inherit;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#d9c7e8;
  transition:all .2s;
}
#yzb .yzb-tools button:active{background:rgba(255,127,176,.3);border-color:rgba(255,127,176,.6);}
#yzb #yzb-lobby-btn{color:#ff9dc4;border-color:rgba(255,157,196,.45);background:rgba(255,127,176,.12);}

#yzb .yzb-stage{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 16px 10px;-webkit-overflow-scrolling:touch;}
#yzb .yzb-scene-label{
  display:inline-block;font-size:11px;letter-spacing:3px;color:#e0b6ff;
  padding:3px 10px;margin-bottom:14px;border-left:2px solid #ff7fb0;
  background:rgba(255,127,176,.08);border-radius:0 8px 8px 0;
}
#yzb .yzb-dialog p{margin:0 0 13px;line-height:1.9;font-size:15px;word-break:break-word;}
#yzb .yzb-narration{color:#e7dcf2;}
#yzb .yzb-tsundere-line{
  position:relative;color:#ffe0ee;background:rgba(255,127,176,.10);
  border-left:3px solid #ff7fb0;border-radius:0 14px 14px 0;
  padding:11px 14px 11px 15px;font-size:14.5px;
}
#yzb .yzb-tsundere-line::before{
  content:"傲娇暴露";display:block;font-size:10px;letter-spacing:2px;
  color:#ff9dc4;margin-bottom:6px;
}
#yzb .yzb-player-line{color:#b9e2ff;text-align:right;font-size:14.5px;}
#yzb .yzb-effect-tip{
  display:block;width:fit-content;margin:0 auto 14px;text-align:center;
  font-size:12.5px;color:#ffe9a8;letter-spacing:1px;
  background:rgba(255,233,168,.09);border-radius:99px;padding:7px 14px;
}
#yzb .yzb-choices{
  flex:0 0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(to top,rgba(12,6,20,.96) 45%,rgba(12,6,20,0));
}
#yzb .yzb-choices:empty{padding:0;background:none;}
#yzb .yzb-choice-btn{
  width:100%;text-align:left;padding:13px 16px;border-radius:14px;
  font-size:14px;line-height:1.55;font-family:inherit;cursor:pointer;
  background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.155);color:#f4ebff;
  transition:transform .15s,background .2s,border-color .2s;
  animation:yzbChoiceIn .3s ease both;
}
@keyframes yzbChoiceIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#yzb .yzb-choice-btn:active{transform:scale(.985);background:rgba(255,127,176,.22);border-color:rgba(255,127,176,.6);}
#yzb .yzb-choice-btn:disabled{opacity:.4;}

/* ---- 结局界面 ---- */
#yzb .yzb-ending-screen{overflow-y:auto;padding:22px;}
#yzb .yzb-ending-card{
  margin:auto;width:100%;max-width:420px;padding:30px 24px;border-radius:22px;text-align:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  animation:yzbCardIn .6s ease both;
}
#yzb .yzb-ending-label{font-size:11px;letter-spacing:6px;color:#ff9dc4;margin-bottom:10px;}
#yzb .yzb-ending-card h2{margin:0 0 16px;font-size:24px;letter-spacing:2px;}
#yzb .yzb-ending-text{font-size:14.5px;line-height:2;color:#e3d6ef;text-align:left;margin:0 0 20px;}
#yzb .yzb-ending-stats{display:flex;justify-content:center;gap:18px;margin-bottom:24px;font-size:12px;color:#c1aed4;}
#yzb .yzb-ending-stats b{color:#ffd9e8;font-size:15px;display:block;margin-top:4px;}

#yzb .yzb-toast{
  position:absolute;left:50%;bottom:12%;transform:translate(-50%,10px);
  padding:9px 18px;border-radius:99px;font-size:13px;font-weight:600;
  background:rgba(255,127,176,.94);color:#2a0d1b;white-space:nowrap;
  opacity:0;pointer-events:none;transition:all .28s ease;z-index:99;
}
#yzb .yzb-toast.show{opacity:1;transform:translate(-50%,0);}
#yzb .yzb-stage::-webkit-scrollbar{width:4px;}
#yzb .yzb-stage::-webkit-scrollbar-thumb{background:rgba(255,127,176,.35);border-radius:99px;}

/* ==================================================================
   小屏适配
   ================================================================== */
@media (max-width:360px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
  #yzg .yzg-start-card h1{font-size:23px;}
  #yzg .yzg-line{font-size:14px;}
  #yzg .yzg-choice{font-size:13px;padding:12px 14px;}
  #yzg .yzg-toolbar button{padding:5px 10px;font-size:11px;}
  #yzb .yzb-start-card h1{font-size:22px;}
  #yzb .yzb-dialog p{font-size:14px;}
  #yzb .yzb-tools button{padding:5px 10px;font-size:11px;}
  .char-avatar{width:96px;height:96px;}
}

#yzw{position:fixed;inset:0;display:none;z-index:10;background:#0b0e1c;}
#yzw.on{display:block;}
#yzw iframe{display:block;width:100%;height:100%;border:0;background:#0b0e1c;}
#yzw-back{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:60;display:none;padding:9px 14px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(19,25,42,.88);color:#fff;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);}
#yzw-back.on{display:block;}
.yzw-avatar{display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#f5e8d4,#b6c5b1 72%,#667b73);color:#40584f;font-family:serif;font-size:42px;font-weight:700;}
@media(max-width:560px){.cards{grid-template-columns:1fr;}}

</style>
</head>

<div id="yzg">

      <div class="yzg-brand">高冷正太线</div>

      <label class="yzg-lbl">你的名字</label>
      <input id="yzg-input-name" class="yzg-input-name" type="text" maxlength="10" placeholder="请输入名字" autocomplete="off">

        <button type="button" class="yzg-gender-btn" data-g="女">女</button>
        <button type="button" class="yzg-gender-btn on" data-g="其他">其他</button>
      </div>

      <button id="yzg-btn-start" class="yzg-btn-main">开始游戏</button>
      <button id="yzg-btn-continue" class="yzg-btn-ghost" style="display:none;">读取存档</button>

      <p class="yzg-tip">好感度 · 依赖度 · 高冷值<br>高冷值越低，他越容易破防。</p>
    </div>
  </section>

  <!-- 游戏页 -->
  <section id="yzg-screen-game" class="yzg-screen yzg-screen-game">
    <div class="yzg-status">
      <div class="yzg-stats">
        <div class="yzg-stat">
          <div class="yzg-stat-top"><span class="yzg-stat-name">好感度</span><span class="yzg-stat-val" id="yzg-v-fav">0</span></div>
          <div class="yzg-track"><div class="yzg-fill" id="yzg-fill-fav"></div></div>
        </div>
        <div class="yzg-stat">
          <div class="yzg-stat-top"><span class="yzg-stat-name">依赖度</span><span class="yzg-stat-val" id="yzg-v-dep">0</span></div>
          <div class="yzg-track"><div class="yzg-fill" id="yzg-fill-dep"></div></div>
        </div>
        <div class="yzg-stat">
          <div class="yzg-stat-top"><span class="yzg-stat-name">高冷值</span><span class="yzg-stat-val" id="yzg-v-cool">60</span></div>
          <div class="yzg-track"><div class="yzg-fill" id="yzg-fill-cool"></div></div>

      <button id="yzb-ending-restart" class="yzb-primary-btn">重新开始</button>
    </div>
  </section>

  <div class="yzb-toast" id="yzb-toast"></div>

     游戏 C：姚智博（衡温者线，独立页面作用域）
     ================================================================== -->

<script>
/* ==================================================================
   全局：大厅 ↔ 游戏 切换
   ================================================================== */
window.__GAMES = window.__GAMES || {};

(function () {
  'use strict';

  var lobby = document.getElementById('lobby');

              <button class=\"gender-btn\" data-gender=\"姐姐\">姐姐</button>\n                        <button class=\"gender-btn active\" data-gender=\"同学\">同学</button>\n                        <button class=\"gender-btn\" data-gender=\"哥哥\">哥哥</button>\n                    </div>\n                </div>\n                <button id=\"btn-start\" class=\"btn-primary\">开 始 游 戏</button>\n                <button id=\"btn-continue\" class=\"btn-secondary\" style=\"display:none;\">读取存档</button>\n                <p class=\"start-note\" id=\"start-continue-hint\">信任是权限，不是情绪。<br>他不会当场爆炸，但会慢慢消失。</p>\n            </div>\n        </div>\n\n        <!-- 游戏页面 -->\n        <div id=\"screen-game\" class=\"screen\">\n            <div class=\"game-header\">\n                <div class=\"status-bar\">\n                    <div class=\"stat-item\">\n                        <div class=\"stat-label\">好感度 <span class=\"stat-value\" id=\"v-fav\">0</span></div>\n                        <div class=\"stat-track\"><div class=\"stat-fill\" id=\"fill-fav\" style=\"width:0%;\"></div></div>\n                    </div>\n                    <div class=\"stat-item\">\n                        <div class=\"stat-label\">信任度 <span class=\"stat-value\" id=\"v-trust\">0</span></div>\n                        <div class=\"stat-track\"><div class=\"stat-fill\" id=\"fill-trust\" style=\"width:0%;\"></div></div>\n                    </div>\n                    <div class=\"stat-item\">\n                        <div class=\"stat-label\">底线值 <span class=\"stat-value\" id=\"v-boundary\">100</span></div>\n                        <div class=\"stat-track\"><div class=\"stat-fill\" id=\"fill-boundary\" style=\"width:100%;\"></div></div>\n                    </div>\n                </div>\n                <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap;\">\n                    <div class=\"violation-indicator\" title=\"越界次数\">\n                        越界\n                        <span id=\"violation-dots\">\n                            <span class=\"violation-dot\"></span><span class=\"violation-dot\"></span><span class=\"violation-dot\"></span>\n                        </span>\n                    </div>\n                    <div class=\"ledger-indicator\" title=\"暗账本\">\n                        暗账\n                        <span id=\"ledger-dots\">\n                            <span class=\"ledger-dot\"></span><span class=\"ledger-dot\"></span><span class=\"ledger-dot\"></span>\n                        </span>\n                    </div>\n                </div>\n                <div class=\"toolbar\">\n                    <button id=\"btn-save\">存档</button>\n                    <button id=\"btn-load\">读档</button>\n                    <button id=\"btn-restart\">重开</button>\n                </div>\n            </div>\n            <div class=\"game-body\">\n                <div class=\"message-log\" id=\"message-log\"></div>\n                <div class=\"choices-area\" id=\"choices-area\"></div>\n            </div>\n        </div>\n\n        <!-- 结局页面 -->\n        <div id=\"screen-end\" class=\"screen\">\n            <div class=\"end-card\">\n                <div class=\"end-tag\">E N D I N G</div>\n                <h2 class=\"end-title\" id=\"end-title\">结局</h2>\n                <div class=\"end-text\" id=\"end-text\"></div>\n                <div class=\"end-stats\" id=\"end-stats\"></div>\n                <button id=\"btn-again\" class=\"btn-primary\">重新开始</button>\n            </div>\n        </div>\n\n        <!-- Toast -->\n        <div id=\"toast\"></div>\n    </div>\n\n    <script>\n        (function() {\n            'use strict';\n\n            /* =========================================================\n               剧 情 数 据\n               ========================================================= */\n            const SCENES = {\n                scene_01: {\n                    id: 'scene_01', phase: 1, next: 'scene_02',\n                    messages: [\n                        { type: 'narrator', text: '开学第三周。你从后门走进教室，听见有人在大声调侃。' },\n                        { type: 'narrator', text: '「姚智博，你那个小组作业又被挂名了吧？怎么不生气啊？」' },\n                        { type: 'narrator', text: '他坐在倒数第二排靠窗的位置，白色卫衣的袖子挽到小臂，正低头看手机。' },\n                        { type: 'yzb', text: '「嗯，习惯了。」' },\n                        { type: 'narrator', text: '他抬起头，冲你这边扫了一眼，很轻地笑了一下。那个笑容里什么温度都没有。' }\n                    ],\n                    choices: [\n                        {\n                            text: '公开维护他',\n                            effects: { fav: 5, trust: 2, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你开口说：报告的内容我也看过，确实是我和他一起做的。' },\n                                { type: 'yzb', text: '姚智博看了你一眼。' },\n                                { type: 'yzb', text: '「……谢谢。」' },\n                                { type: 'narrator', text: '他低下头，过了几秒，把手机屏幕朝你这边偏了偏。是一张你们小组作业的笔记截图。' },\n                                { type: 'yzb', text: '「下次要资料，直接问我要。」（他把手机塞回卫衣口袋，耳根有点红）' }\n                            ]\n                        },\n                        {\n                            text: '稍微调侃一下',\n                            effects: { fav: 0, trust: 0, boundary: 0, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你笑着接了一句：「智博就是太好说话啦，被欺负了也不吭声。」' },\n                                { type: 'yzb', text: '他跟着笑了一下，没说话。' },\n                                { type: 'narrator', text: '晚自习后，你的手机亮了一下。一条微信。' },\n                                { type: 'yzb', text: '「那个玩笑，其实我不太喜欢。不过没事。」' },\n                                { type: 'narrator', text: '语气很轻。但你知道，有些事他记下了。' }\n                            ]\n                        },\n                        {\n                            text: '当众拆台',\n                            effects: { fav: -8, trust: -5, boundary: -15, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你说：「姚智博，你那个方案里还有三处数据是错的，你怎么好意思挂名？」' },\n                                { type: 'narrator', text: '教室瞬间安静。他脸上的笑意凝固了半秒，然后慢慢收回去。' },\n                                { type: 'yzb', text: '「……哦。」' },\n                                { type: 'narrator', text: '他平静地看了你一眼，低下头继续看手机。' },\n                                { type: 'narrator', text: '但那天下午，他把自己的资料从共享文档里全部退出了。' }\n                            ]\n                        },\n                        {\n                            text: '沉默',\n                            effects: { fav: 1, trust: 0, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你什么都没说。他也没指望谁。' },\n                                { type: 'yzb', text: '（翻书的动作很轻，像什么都没听见）' },\n                                { type: 'narrator', text: '你们之间隔了两个座位，沉默像一道透明的墙。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_02: {\n                    id: 'scene_02', phase: 1, next: 'scene_03',\n                    messages: [\n                        { type: 'narrator', text: '小组汇报那天，另一个组员把所有功劳都揽到自己身上。' },\n                        { type: 'narrator', text: '姚智博坐在旁边，表情很平。你注意到他放在桌下的手慢慢攥紧了，又松开。' },\n                        { type: 'yzb', text: '（笑）「没事，资料主要也不是我整理的。」' },\n                        { type: 'narrator', text: '但你见过他半夜两点还在改PPT，眼下的青黑像是化开的水墨。' }\n                    ],\n                    choices: [\n                        {\n                            text: '补一句：资料主要是我和他整理的',\n                            effects: { fav: 6, trust: 5, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '讲台上安静了一下。那个组员讪讪地闭了嘴。' },\n                                { type: 'yzb', text: '姚智博：“……”' },\n                                { type: 'narrator', text: '结束后，他从前排绕过来，在你旁边停了一下。' },\n                                { type: 'yzb', text: '「……晚上图书馆，老位置。请你喝咖啡。」' },\n                                { type: 'narrator', text: '他的语气很淡，但离开时耳朵上那点红色，一路蔓延到了领口。' }\n                            ]\n                        },\n                        {\n                            text: '装作没听见',\n                            effects: { fav: -3, trust: -2, boundary: 0, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你低头整理笔记。' },\n                                { type: 'yzb', text: '姚智博笑了一下，没再说什么。' },\n                                { type: 'narrator', text: '那天之后，他做PPT的文档只分享给了另一个组员。你的权限被取消了。' },\n                                { type: 'narrator', text: '没有一句质问。就像什么都没发生过。' }\n                            ]\n                        },\n                        {\n                            text: '也抢一部分功劳',\n                            effects: { fav: -10, trust: -8, boundary: -20, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你站起来补充：其实里面有几个板块是我做的。' },\n                                { type: 'narrator', text: '教室里出现了一阵尴尬的安静。姚智博看了你一眼，慢慢把手机翻过去扣在桌上。' },\n                                { type: 'yzb', text: '「……挺好。」' },\n                                { type: 'narrator', text: '他没有当场发火。只是之后的每次小组讨论，他都坐到了离你最远的那个位置。' }\n                            ]\n                        },\n                        {\n                            text: '课后私下跟他说：我都知道',\n                            effects: { fav: 5, trust: 4, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「……不用你操心。」' },\n                                { type: 'narrator', text: '他别开脸。过了一阵，才补了一句。' },\n                                { type: 'yzb', text: '「但谢了。」' },\n                                { type: 'narrator', text: '那天晚自习，他把整理好的笔记推到你桌上。上面用铅笔圈出了你之前问过他的所有重点。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_03: {\n                    id: 'scene_03', phase: 1, next: 'scene_04',\n                    messages: [\n                        { type: 'narrator', text: '图书馆闭馆前一个小时，你在老位置看见他。' },\n                        { type: 'narrator', text: '他的桌面上摊着笔记本和电脑，左手拿着笔，右手关节抵着下巴，像是在发消息。' },\n                        { type: 'narrator', text: '你走过去坐下。他抬头看你，眼睛在暖黄的灯下显得很浅。' },\n                        { type: 'yzb', text: '「来了。」' },\n                        { type: 'narrator', text: '手机屏幕还亮着。是一个聊天窗口，备注只有一个句号。' }\n                    ],\n                    choices: [\n                        {\n                            text: '尊重他的空间，安静坐下学习',\n                            effects: { fav: 5, trust: 6, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你们各自埋头。中间只有笔尖划过纸面的沙沙声。' },\n                                { type: 'yzb', text: '（把手机反扣在桌上）「……你复习到哪了？」' },\n                                { type: 'narrator', text: '他先开了口。这是你们认识以来，他第一次主动问你学习之外的事情。' }\n                            ]\n                        },\n                        {\n                            text: '凑过去看他的手机',\n                            effects: { fav: -10, trust: -12, boundary: -20, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你笑着说：「看什么呢，这么入神？」' },\n                                { type: 'yzb', text: '他不动声色地把手机锁屏，屏幕朝下扣在桌上。' },\n                                { type: 'yzb', text: '「没什么。」' },\n                                { type: 'narrator', text: '他的语气没有任何波动。但之后一个小时，他都没有再和你说一句话。' }\n                            ]\n                        },\n                        {\n                            text: '分享你的笔记给他',\n                            effects: { fav: 7, trust: 5, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你把笔记本推过去：「你上次说这块知识点乱，我重新整理了一遍。」' },\n                                { type: 'yzb', text: '他盯着你的笔记看了几秒。' },\n                                { type: 'yzb', text: '「……你挺会整理。」' },\n                                { type: 'narrator', text: '他把自己随身的日程本打开，撕下最后一页，写了一串字母和数字推给你。' },\n                                { type: 'yzb', text: '「我的个人图书馆账号。分你一半时间。」' }\n                            ]\n                        },\n                        {\n                            text: '约他下课一起走',\n                            effects: { fav: 5, trust: 2, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「……行。」' },\n                                { type: 'narrator', text: '他说行的时候，眼睛没有抬。但收拾书包的速度，明显快了一点。' },\n                                { type: 'narrator', text: '下楼时他走在前面，到了门口突然停下，回头等你。光线把他的影子拉得很长。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_04: {\n                    id: 'scene_04', phase: 2, next: 'scene_05',\n                    messages: [\n                        { type: 'narrator', text: '晚上十一点。你给他发了一条消息，问他一道题。' },\n                        { type: 'narrator', text: '十分钟过去，他既没回，状态却一直显示在线。' },\n                        { type: 'narrator', text: '你看着对话框上方那个忽明忽暗的字样。' },\n                        { type: 'yzb', text: '（凌晨零点十七分）「刚才在忙。」' },\n                        { type: 'narrator', text: '四个字，干净利落。没有解释更多。' }\n                    ],\n                    choices: [\n                        {\n                            text: '「没事，我就是问问。别太累。」',\n                            effects: { fav: 8, trust: 10, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '他沉默了一会儿。' },\n                                { type: 'yzb', text: '「……不是故意不回你。」' },\n                                { type: 'yzb', text: '「家里的事。不方便说。」' },\n                                { type: 'narrator', text: '这是他第一次向你提到家里。虽然只有四个字。但你已经能感觉到，他松了一点。' }\n                            ]\n                        },\n                        {\n                            text: '「你干嘛去了？怎么现在才回？」',\n                            effects: { fav: -5, trust: -4, boundary: 0, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'yzb', text: '「刚才在忙。」' },\n                                { type: 'narrator', text: '没有更多了。' },\n                                { type: 'narrator', text: '你等了很久，屏幕再也没亮起来。下次你再发消息，他的回复从三个字变成了一个字：「嗯」。' }\n                            ]\n                        },\n                        {\n                            text: '连续发好几条消息追问',\n                            effects: { fav: -6, trust: -8, boundary: -10, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你连着发了五条。他一条都没回。' },\n                                { type: 'narrator', text: '直到第二天中午，你才收到一句。' },\n                                { type: 'yzb', text: '「知道了。以后不用这样找我。」' },\n                                { type: 'narrator', text: '语气平得没有一丝温度。你感觉有些东西在退潮。' }\n                            ]\n                        },\n                        {\n                            text: '不再追问，转移话题',\n                            effects: { fav: 3, trust: 4, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你发了一张白天拍到的有趣照片。' },\n                                { type: 'yzb', text: '「……好笑。」' },\n                                { type: 'narrator', text: '就两个字。但五分钟后，他又补了一句。' },\n                                { type: 'yzb', text: '「明天帮我看看数学。」' }\n                            ]\n                        }\n                    ]\n                },\n                scene_05: {\n                    id: 'scene_05', phase: 2, next: 'scene_06',\n                    messages: [\n                        { type: 'narrator', text: '你不小心听见他的室友在走廊上说：' },\n                        { type: 'narrator', text: '「姚智博那个人，根本没他表面上那么温和。他把我们几个人的事，全记在一个小本子上。」' },\n                        { type: 'narrator', text: '很快又有人接话：「对对对，听说他还给身边所有人分了组，谁越界了就踢出去。」' },\n                        { type: 'narrator', text: '你站在原地，看见他从前面的拐角走出来。' },\n                        { type: 'yzb', text: '（低头，肩膀很轻微地绷了一下）' }\n                    ],\n                    choices: [\n                        {\n                            text: '等他室友走后，对他说：我没把这些话当真',\n                            effects: { fav: 8, trust: 15, boundary: 5, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '他停下脚步，背对着你站了很久。' },\n                                { type: 'yzb', text: '「……你信吗？」' },\n                                { type: 'narrator', text: '他的声音很轻，像是怕听到答案。' },\n                                { type: 'yzb', text: '「我确实会记一些事。因为……我以前信错过人。」' },\n                                { type: 'narrator', text: '他说完，把手机解锁，点开一个你从未见过的加密文件。里面只有一行字：「今天她帮了我。记。」' }\n                            ]\n                        },\n                        {\n                            text: '假装什么都没听见',\n                            effects: { fav: -2, trust: -3, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你们擦肩而过的时候，他看了你一眼。' },\n                                { type: 'yzb', text: '（什么也没说）' },\n                                { type: 'narrator', text: '那一眼很短。但你知道，他把你的沉默一起记下了。' }\n                            ]\n                        },\n                        {\n                            text: '追问你：他们说的是真的吗？',\n                            effects: { fav: -8, trust: -12, boundary: -10, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你问得有些急。' },\n                                { type: 'yzb', text: '「如果是真的，你打算怎样？」' },\n                                { type: 'narrator', text: '他反问你。眼睛没有躲。' },\n                                { type: 'yzb', text: '「我在你心里，就是那种人吗。」' },\n                                { type: 'narrator', text: '他的语气甚至没有起伏。但你知道，这是他在告别。' }\n                            ]\n                        },\n                        {\n                            text: '对他说：我相信你，不问道理',\n                            effects: { fav: 6, trust: 10, boundary: 3, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「……你这个人。」' },\n                                { type: 'narrator', text: '他笑了一下，很轻，像松了一口气。' },\n                                { type: 'yzb', text: '「算了。有些事我以后会告诉你。不是现在。」' },\n                                { type: 'narrator', text: '他往你这边靠近了半步。这是你们之间最近的一次距离。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_06: {\n                    id: 'scene_06', phase: 2, next: 'scene_07',\n                    messages: [\n                        { type: 'narrator', text: '傍晚的食堂。你远远看见他和一个女生坐在一起。' },\n                        { type: 'narrator', text: '两人隔着一张餐桌，女生把奶茶往他那边推了推。他笑了一下。' },\n                        { type: 'narrator', text: '你端着餐盘，坐在了靠窗的位置。他看见了你，动作顿了一下。' },\n                        { type: 'yzb', text: '（和女生说了句什么，然后往你这边看过来）' }\n                    ],\n                    choices: [\n                        {\n                            text: '装作不在意的样子，打声招呼',\n                            effects: { fav: 3, trust: 2, boundary: 0, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你笑着挥了挥手。他点点头。' },\n                                { type: 'yzb', text: '「……你一个人？」' },\n                                { type: 'narrator', text: '他站起来，把那个女生留在原地。' },\n                                { type: 'yzb', text: '（坐到你对面）「她只是社团的。别多想。」' },\n                                { type: 'narrator', text: '他在解释。很轻，但确实是在解释。' }\n                            ]\n                        },\n                        {\n                            text: '冷着脸走开',\n                            effects: { fav: -7, trust: -5, boundary: 0, violation: 0, ledger: 2 },\n                            replies: [\n                                { type: 'narrator', text: '你径直从他们旁边走过去，没有停。' },\n                                { type: 'narrator', text: '你听见身后椅子拉开的声音。' },\n                                { type: 'yzb', text: '「……你站住。」' },\n                                { type: 'narrator', text: '他的语气很平。但这是他第一次在公开场合叫住你。' },\n                                { type: 'yzb', text: '「你生气归生气。说清楚。」' }\n                            ]\n                        },\n                        {\n                            text: '直接问他：你俩挺熟啊？',\n                            effects: { fav: -5, trust: -6, boundary: -5, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'yzb', text: '「你注意得挺多。」' },\n                                { type: 'narrator', text: '他没有否认。也没有肯定。' },\n                                { type: 'yzb', text: '「我交朋友，不需要向谁汇报吧。」' },\n                                { type: 'narrator', text: '他低头继续吃饭。但那一整个晚上，他都没有再看你一眼。' }\n                            ]\n                        },\n                        {\n                            text: '信任他，自己找地方坐下',\n                            effects: { fav: 10, trust: 12, boundary: 2, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你坐下后，他过了几分钟就过来了。' },\n                                { type: 'yzb', text: '「那个位置太吵。过来。」' },\n                                { type: 'narrator', text: '他把书包放在你对面，人坐了下来。' },\n                                { type: 'yzb', text: '（抬头）「以后你过来，提前说一声。我等你。」' }\n                            ]\n                        }\n                    ]\n                },\n                scene_07: {\n                    id: 'scene_07', phase: 3, next: 'scene_08',\n                    messages: [\n                        { type: 'narrator', text: '秋末。天台风很大。' },\n                        { type: 'narrator', text: '他约你来的。这是他第一次主动把你叫到没人的地方。' },\n                        { type: 'yzb', text: '「有件事，我想问你。」' },\n                        { type: 'narrator', text: '他站在栏杆旁边，背对着楼下的车流。' },\n                        { type: 'yzb', text: '「我在你眼里，是不是很好说话，很能忍，什么事都讲一遍就过去了？」' }\n                    ],\n                    choices: [\n                        {\n                            text: '认真听他说完，承认自己也有错',\n                            effects: { fav: 15, trust: 12, boundary: 10, violation: 0, ledger: -1 },\n                            replies: [\n                                { type: 'narrator', text: '你沉默了很久，说：我知道之前有些事是我越界了。' },\n                                { type: 'narrator', text: '他转过身，没看你。风吹起他卫衣的帽子。' },\n                                { type: 'yzb', text: '「……我不喜欢被架住。当面笑，回家才敢松口气。我有时候也觉得自己很没意思。」' },\n                                { type: 'narrator', text: '他第一次这样说。' },\n                                { type: 'yzb', text: '「别人怎么看我无所谓。我只想知道，你怎么想。」' },\n                                { type: 'narrator', text: '天台的风很冷。但他的眼睛是暖的。' }\n                            ]\n                        },\n                        {\n                            text: '说：你想太多了，我没有那个意思',\n                            effects: { fav: -8, trust: -10, boundary: -15, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'yzb', text: '「你看，你永远说我想太多。」' },\n                                { type: 'narrator', text: '他笑了。那个笑容近乎透明。' },\n                                { type: 'yzb', text: '「算了。有些事不是靠解释能解决的。」' },\n                                { type: 'narrator', text: '他往天台门口走。经过你时，脚步顿了一下。' },\n                                { type: 'yzb', text: '「……先这样吧。」' }\n                            ]\n                        },\n                        {\n                            text: '保持沉默',\n                            effects: { fav: -3, trust: -3, boundary: 0, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你们就这样站了很久。' },\n                                { type: 'yzb', text: '“嗯。”' },\n                                { type: 'narrator', text: '他把卫衣帽子拉起来。' },\n                                { type: 'yzb', text: '「我先走了。你……想好了再说吧。」' },\n                                { type: 'narrator', text: '他走后，你发现栏杆边有半瓶没喝完的水，还是温的。' }\n                            ]\n                        },\n                        {\n                            text: '给他一个拥抱',\n                            effects: { fav: 8, trust: 6, boundary: 5, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你没有说话，只是上前抱住了他。' },\n                                { type: 'narrator', text: '他僵住了。像被冻在原地。' },\n                                { type: 'yzb', text: '「……放开。」' },\n                                { type: 'narrator', text: '但他的手慢慢抓住了你的衣角。很轻，很慢。' },\n                                { type: 'yzb', text: '「（声音闷在卫衣里）你别以为这样我就能算了。」' }\n                            ]\n                        }\n                    ]\n                },\n                scene_08: {\n                    id: 'scene_08', phase: 3, next: 'scene_09',\n                    messages: [\n                        { type: 'narrator', text: '天台风波还没过去。一些关于他的传言在系里散开。' },\n                        { type: 'narrator', text: '「小团体里的笑面虎」「表面温和私下算计」「和异性不清不楚」……' },\n                        { type: 'narrator', text: '他走在路上，有人故意绕开。' },\n                        { type: 'yzb', text: '（低头看手机，没什么表情）' },\n                        { type: 'narrator', text: '你看见有人在班级群里阴阳怪气地发了一句什么。他看了一眼，关掉了屏幕。' }\n                    ],\n                    choices: [\n                        {\n                            text: '公开澄清，说你不是他们说的那样',\n                            effects: { fav: 10, trust: 10, boundary: 5, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你在群里发了一段话。很长，最后一句是：我比他们更了解你。' },\n                                { type: 'narrator', text: '他没有回复。' },\n                                { type: 'narrator', text: '但那天放学，他第一次在教学楼门口等你。' },\n                                { type: 'yzb', text: '「……那种话，你不用说。我知道自己是什么人。」' },\n                                { type: 'narrator', text: '说完，他把一个U盘塞给你。里面是他所有课业笔记。' }\n                            ]\n                        },\n                        {\n                            text: '陪在他身边，不离开',\n                            effects: { fav: 12, trust: 14, boundary: 6, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你没有多说。只是坐到他旁边，和他一起沉默。' },\n                                { type: 'yzb', text: '『（过了很久）』' },\n                                { type: 'yzb', text: '「……你为什么不走。」' },\n                                { type: 'narrator', text: '他的声音很轻，轻得像一声叹息。' },\n                                { type: 'yzb', text: '「我这种人，身边留不住人的。」' },\n                                { type: 'narrator', text: '你握住他的手。他的手指很凉，但没有抽开。' }\n                            ]\n                        },\n                        {\n                            text: '保持距离，避免被牵连',\n                            effects: { fav: -10, trust: -8, boundary: -5, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '你慢慢减少了和他一起走的次数。他什么也没问。' },\n                                { type: 'yzb', text: '（第二天见面，只是点点头）' },\n                                { type: 'narrator', text: '他朋友圈更新了一条，只有一张天台的照片。没有配字。' },\n                                { type: 'narrator', text: '你点了个赞。他没有回。' }\n                            ]\n                        },\n                        {\n                            text: '和其他人一起谈论这些传言',\n                            effects: { fav: -15, trust: -18, boundary: -25, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你承认，你那次也参与了那些聊天。' },\n                                { type: 'narrator', text: '他撞见了。他什么也没说。' },\n                                { type: 'yzb', text: '（看了你一眼，转身走了）' },\n                                { type: 'narrator', text: '从那天起，你从「可以说话的人」变成了「需要保持距离的人」。' },\n                                { type: 'narrator', text: '他没有拉黑你。但给你的备注，从名字变成了一个句号。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_09: {\n                    id: 'scene_09', phase: 3, next: 'scene_10',\n                    messages: [\n                        { type: 'narrator', text: '晚上十一点四十七分。你的手机响了。' },\n                        { type: 'narrator', text: '是他打来的。' },\n                        { type: 'yzb', text: '「……吵到你了吗？」' },\n                        { type: 'narrator', text: '他的声音有些哑。背景很安静，偶尔有风的声音。' },\n                        { type: 'yzb', text: '「我在学校南门。你要是有空，就过来。」' }\n                    ],\n                    choices: [\n                        {\n                            text: '立刻赶过去',\n                            effects: { fav: 15, trust: 15, boundary: 8, violation: 0, ledger: -1 },\n                            replies: [\n                                { type: 'narrator', text: '你到的时候，他坐在台阶上，卫衣帽子遮住了大半张脸。' },\n                                { type: 'yzb', text: '「……你怎么真来了。」' },\n                                { type: 'narrator', text: '他抬头看你。眼角有点红。' },\n                                { type: 'yzb', text: '「我就是……突然想听听你说话。」' },\n                                { type: 'narrator', text: '那晚你们聊了很多。从凌晨的月亮，聊到他高中时被最好的朋友背叛。' },\n                                { type: 'yzb', text: '「你是第一个。听完这些还没走的人。」' }\n                            ]\n                        },\n                        {\n                            text: '问他：你是不是遇到什么事了',\n                            effects: { fav: 8, trust: 8, boundary: 3, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「没什么。就是突然有点……不确定。」' },\n                                { type: 'narrator', text: '他停了一下。' },\n                                { type: 'yzb', text: '「不确定你有没有真的把我当回事。」' },\n                                { type: 'narrator', text: '你想回答。他却先接了一句。' },\n                                { type: 'yzb', text: '「算了。抽根烟就睡。你别担心。」' }\n                            ]\n                        },\n                        {\n                            text: '说：这么晚了你别闹了',\n                            effects: { fav: -5, trust: -6, boundary: -5, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '电话那边沉默了很久。' },\n                                { type: 'yzb', text: '「……好。你睡吧。」' },\n                                { type: 'narrator', text: '他挂了。' },\n                                { type: 'narrator', text: '那条通话记录，后来你再也没有打通过。' }\n                            ]\n                        },\n                        {\n                            text: '说：我在，你说',\n                            effects: { fav: 10, trust: 12, boundary: 4, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「……在就好。」' },\n                                { type: 'narrator', text: '他的呼吸声从电话那头传过来，很轻。' },\n                                { type: 'yzb', text: '「我好像，有点习惯有你在旁边了。」' },\n                                { type: 'narrator', text: '这句话说完，电话里出现了很长一段沉默。像是他把脸埋进了手臂里。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_10: {\n                    id: 'scene_10', phase: 4, next: 'scene_11',\n                    messages: [\n                        { type: 'narrator', text: '校园祭。你们班抽到了咖啡店，他负责账目。' },\n                        { type: 'narrator', text: '不知道谁把他的名字写在了道具板上，旁边画了个笑脸。' },\n                        { type: 'yzb', text: '（看见后，皱了皱眉，但没擦）' },\n                        { type: 'narrator', text: '有人起哄：「姚老板，别摆臭脸嘛，快给客人们笑一个！」' }\n                    ],\n                    choices: [\n                        {\n                            text: '帮他擦掉那块道具板',\n                            effects: { fav: 8, trust: 6, boundary: 3, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你走过去把那个笑脸擦掉，换成了一个小太阳。' },\n                                { type: 'yzb', text: '「……多此一举。」' },\n                                { type: 'narrator', text: '他的嘴角却很小地弯了一下。' },\n                                { type: 'yzb', text: '「不过，还行。」' }\n                            ]\n                        },\n                        {\n                            text: '说：姚老板本来就很可爱啊',\n                            effects: { fav: 6, trust: 3, boundary: -5, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '他脸上的表情僵了一下。' },\n                                { type: 'yzb', text: '「……这种话，别在这么多人的时候说。」' },\n                                { type: 'narrator', text: '他别过脸，耳朵有点红。' },\n                                { type: 'narrator', text: '但那天下午，他当着所有人的面，把他的第一杯咖啡递给了你。' }\n                            ]\n                        },\n                        {\n                            text: '当众故意开玩笑让他下不来台',\n                            effects: { fav: -12, trust: -10, boundary: -20, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你说了那句之后，周围的空气像是凝固了一秒。' },\n                                { type: 'yzb', text: '「……挺有意思。」' },\n                                { type: 'narrator', text: '他笑着回了一句，然后转身走了。' },\n                                { type: 'narrator', text: '一整天，他再没有和你说话。直到收拾东西时，他把你递来的纸盒推开了。' }\n                            ]\n                        },\n                        {\n                            text: '安静地陪他一起准备',\n                            effects: { fav: 7, trust: 8, boundary: 4, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你们一起清点备用金、折纸杯、写菜单。' },\n                                { type: 'yzb', text: '「……这上面写你名字吧。你字好看。」' },\n                                { type: 'narrator', text: '他教你做手冲。动作很慢，但每一步都会确认你有没有在听。' },\n                                { type: 'yzb', text: '「以后想喝，就自己冲。机器我借你。」' }\n                            ]\n                        }\n                    ]\n                },\n                scene_11: {\n                    id: 'scene_11', phase: 4, next: 'scene_12',\n                    messages: [\n                        { type: 'narrator', text: '期末考试前一周。你发现他连着三天都泡在图书馆。' },\n                        { type: 'narrator', text: '眼下有很重的青色，手边是第五杯黑咖啡。' },\n                        { type: 'yzb', text: '（抬头看你）「……你怎么还在。」' },\n                        { type: 'narrator', text: '桌上摊着三本笔记和一台不断震动的手机。他设了勿扰。' }\n                    ],\n                    choices: [\n                        {\n                            text: '陪他一起复习，不打扰',\n                            effects: { fav: 10, trust: 10, boundary: 3, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你坐到他旁边，打开自己的书。谁也没说话。' },\n                                { type: 'narrator', text: '一个小时后，他把一瓶热饮推到你手边。' },\n                                { type: 'yzb', text: '「你已经坐了一个小时了。换换脑子。」' },\n                                { type: 'narrator', text: '瓶子上贴着一张便签：「考完去吃校门口那家拉面。我请。」' }\n                            ]\n                        },\n                        {\n                            text: '给他施加压力，说：你考不过就完了',\n                            effects: { fav: -8, trust: -6, boundary: -5, violation: 0, ledger: 1 },\n                            replies: [\n                                { type: 'narrator', text: '他手里的笔停了一下。' },\n                                { type: 'yzb', text: '「……你这种话，我只会更烦。」' },\n                                { type: 'narrator', text: '他站起身，把书合上。' },\n                                { type: 'yzb', text: '「今天先到这吧。你回吧。」' }\n                            ]\n                        },\n                        {\n                            text: '约他一起出去透透气',\n                            effects: { fav: 7, trust: 5, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「不去。没时间。」' },\n                                { type: 'narrator', text: '他顿了顿。' },\n                                { type: 'yzb', text: '「……十五分钟。就十五分钟。」' },\n                                { type: 'narrator', text: '他跟着你走到操场边，深深吸了一口气。' },\n                                { type: 'yzb', text: '「……你这个人，挺会逼人休息的。」' }\n                            ]\n                        },\n                        {\n                            text: '说：你帮我补课，我给你带吃的',\n                            effects: { fav: 5, trust: 3, boundary: 0, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'yzb', text: '「成交。」' },\n                                { type: 'narrator', text: '他连犹豫都没有。' },\n                                { type: 'yzb', text: '「不过吃的得是我选的。你上次那家店不行。」' },\n                                { type: 'narrator', text: '你看他弯起眼睛。那笑容只有一点点，但很真。' }\n                            ]\n                        }\n                    ]\n                },\n                scene_12: {\n                    id: 'scene_12', phase: 4, next: null,\n                    messages: [\n                        { type: 'narrator', text: '考试结束。晚上下起了雨。' },\n                        { type: 'narrator', text: '你走出教学楼的时候，看见他站在玻璃门旁，手里拿着两把伞。' },\n                        { type: 'yzb', text: '「……没料到会下。多拿了一把。」' },\n                        { type: 'narrator', text: '他的肩膀被风吹得有点湿。' },\n                        { type: 'yzb', text: '「陪我走一段吧。就一段。」' },\n                        { type: 'narrator', text: '雨声很大。他把伞往你那边倾了倾。' }\n                    ],\n                    choices: [\n                        {\n                            text: '「你在我这里，是最高权限。」',\n                            effects: { fav: 15, trust: 12, boundary: 8, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '他停下了。' },\n                                { type: 'yzb', text: '「……这种话，不要随便说。」' },\n                                { type: 'narrator', text: '他伸出一只手。指尖碰到你的，然后慢慢扣住了。' },\n                                { type: 'yzb', text: '「以后，你在我这里的权限也是最高的。」' },\n                                { type: 'narrator', text: '他的声音被雨声打湿，却很清晰。' },\n                                { type: 'yzb', text: '「……你叫我的时候，我会在。」' }\n                            ]\n                        },\n                        {\n                            text: '「我有个要求，你以后不许和异性单独吃饭。」',\n                            effects: { fav: -10, trust: -15, boundary: -35, violation: 1, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '他说这话的时候，你看到他的表情一点一点凉下去。' },\n                                { type: 'yzb', text: '「这个要求我不接受。」' },\n                                { type: 'narrator', text: '他把伞往回收了收。' },\n                                { type: 'yzb', text: '「我不喜欢你用这种话要求我。人和人的关系，不是这样算的。」' },\n                                { type: 'narrator', text: '他转身走进雨里，没有再回头。' }\n                            ]\n                        },\n                        {\n                            text: '安静地走完这段路',\n                            effects: { fav: 10, trust: 15, boundary: 5, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '你们并肩走。谁也没先开口。' },\n                                { type: 'yzb', text: '『（走到宿舍楼下）』' },\n                                { type: 'yzb', text: '「……就到这吧。」' },\n                                { type: 'narrator', text: '他把你送到门口，没有收伞。' },\n                                { type: 'yzb', text: '「你们宿舍门禁早。我看着你进去。」' },\n                                { type: 'narrator', text: '他站在台阶下，伞沿挡着雨。你回头时，他还在。' }\n                            ]\n                        },\n                        {\n                            text: '说：我们到底是什么关系？',\n                            effects: { fav: 5, trust: 3, boundary: -3, violation: 0, ledger: 0 },\n                            replies: [\n                                { type: 'narrator', text: '他看了你很久。' },\n                                { type: 'yzb', text: '「你希望是什么？」' },\n                                { type: 'narrator', text: '雨顺着伞骨滑下来。' },\n                                { type: 'yzb', text: '「我从不随便把人放进某个分组。你能走到这里，自己应该明白。」' },\n                                { type: 'narrator', text: '他说完，把伞塞进你手里。' },\n                                { type: 'yzb', text: '「下次别淋雨。我联系得上你。」' }\n                            ]\n                        }\n                    ]\n                }\n            };\n\n            /* =========================================================\n               游 戏 状 态\n               ========================================================= */\n            const SAVE_KEY = 'hengwen_sim_v1';\n            const TYPE_SPEED = 18;\n\n            let state = {\n                name: '',\n                gender: '同学',\n                fav: 0,\n                trust: 0,\n                boundary: 100,\n                violation: 0,\n                ledger: 0,\n                sceneId: 'scene_01',\n                scenePhase: 1,\n                visitedScenes: []\n            };\n\n            let token = 0;\n            let skipFlag = false;\n            let busy = false;\n            let currentScene = null;\n\n            const $ = (id) => document.getElementById(id);\n            const body = document.body;\n            const screenStart = $('screen-start');\n            const screenGame = $('screen-game');\n            const screenEnd = $('screen-end');\n            const screenPrologue = $('screen-prologue');\n            const logEl = $('message-log');\n            const choicesEl = $('choices-area');\n            const toastEl = $('toast');\n            let toastTimer = null;\n\n            /* =========================================================\n               工 具 函 数\n               ========================================================= */\n            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }\n            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }\n            function withName(text) { return String(text).replace(/\\{name\\}/g, state.name || '你'); }\n            function showToast(msg) {\n                toastEl.textContent = msg;\n                toastEl.classList.add('visible');\n                clearTimeout(toastTimer);\n                toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1500);\n            }\n            function scrollLog() { logEl.scrollTop = logEl.scrollHeight; }\n\n            function currentState() {\n                if (state.violation >= 3 || state.boundary < 40) return 'cold';\n                if (state.fav > 70 && state.trust > 60 && state.boundary > 70) return 'hot';\n                if (state.fav > 25 && state.trust > 20) return 'warm';\n                return 'warm';\n            }\n            function applyState() { body.dataset.state = currentState(); }\n\n            function updateUI() {\n                $('v-fav').textContent = state.fav;\n                $('v-trust').textContent = state.trust;\n                $('v-boundary').textContent = state.boundary;\n                $('fill-fav').style.width = clamp(state.fav, 0, 100) + '%';\n                $('fill-trust').style.width = clamp(state.trust, 0, 100) + '%';\n                $('fill-boundary').style.width = clamp(state.boundary, 0, 100) + '%';\n                document.querySelectorAll('#violation-dots .violation-dot').forEach((dot, i) => {\n                    dot.classList.toggle('filled', i < state.violation);\n                });\n                document.querySelectorAll('#ledger-dots .ledger-dot').forEach((dot, i) => {\n                    dot.classList.toggle('filled', i < state.ledger);\n                });\n                applyState();\n            }\n\n            function showScreen(screen) {\n                [screenStart, screenGame, screenEnd, screenPrologue].forEach(s => s.classList.remove('active'));\n                screen.classList.add('active');\n            }\n\n            function saveGame(manual) {\n                try {\n                    localStorage.setItem(SAVE_KEY, JSON.stringify(state));\n                    if (manual) showToast('已存档');\n                } catch (e) { if (manual) showToast('存档失败'); }\n            }\n            function loadSave() {\n                try {\n                    const raw = localStorage.getItem(SAVE_KEY);\n                    if (!raw) { showToast('没有存档'); return false; }\n                    const d = JSON.parse(raw);\n                    state = { ...state, ...d };\n                    showScreen(screenGame);\n                    updateUI();\n                    playScene(state.sceneId);\n                    return true;\n                } catch (e) { showToast('存档已损坏'); return false; }\n            }\n            function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }\n            function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }\n\n            /* =========================================================\n               打 字 机 与 消 息 渲 染\n               ========================================================= */\n            function createMessageElement(msg) {\n                const div = document.createElement('div');\n                div.className = 'message';\n                const isYzb = (msg.type === 'yzb');\n                const isPlayer = (msg.type === 'player');\n                const isNarr = (msg.type === 'narrator');\n                if (isYzb) div.classList.add('speaker-yzb');\n                if (isPlayer) div.classList.add('speaker-player');\n                if (isNarr) div.classList.add('speaker-narrator');\n\n                const speaker = document.createElement('div');\n                speaker.className = 'msg-speaker';\n                if (isYzb) speaker.textContent = '衡温者';\n                else if (isPlayer) { speaker.textContent = state.name; speaker.classList.add('player'); }\n                else { speaker.textContent = '· 旁白 ·'; speaker.classList.add('narrator'); }\n                div.appendChild(speaker);\n\n                const text = document.createElement('div');\n                text.className = 'msg-text';\n                if (isNarr) text.classList.add('narrator');\n                if (isPlayer) text.classList.add('player');\n                text.textContent = '';\n                div.appendChild(text);\n                logEl.appendChild(div);\n                scrollLog();\n                return { div, textEl: text, msg };\n            }\n\n            async function typeOut(element, fullText, myToken) {\n                let index = 0;\n                skipFlag = false;\n                while (index < fullText.length) {\n                    if (token !== myToken) return false;\n                    if (skipFlag) { element.textContent = fullText; break; }\n                    index++;\n                    element.textContent = fullText.slice(0, index);\n                    if (index % 2 === 0) scrollLog();\n                    await sleep(TYPE_SPEED);\n                }\n                element.textContent = fullText;\n                scrollLog();\n                return true;\n            }\n\n            async function playMessages(messages, myToken) {\n                for (const msg of messages) {\n                    if (token !== myToken) return false;\n                    const { textEl, msg: m } = createMessageElement(msg);\n                    const ok = await typeOut(textEl, withName(m.text), myToken);\n                    if (!ok) return false;\n                    await sleep(120);\n                }\n                return true;\n            }\n\n            /* =========================================================\n               场 景 流 程\n               ========================================================= */\n            async function playScene(sceneId) {\n                const myToken = ++token;\n                const scene = SCENES[sceneId];\n                if (!scene) { showEnding(); return; }\n\n                currentScene = scene;\n                state.sceneId = sceneId;\n                state.scenePhase = scene.phase;\n                if (!state.visitedScenes.includes(sceneId)) state.visitedScenes.push(sceneId);\n\n                // 检查暗账崩塌\n                if (scene.phase >= 3 && state.ledger >= 3) {\n                    await showDarkLedgerEnding(myToken);\n                    return;\n                }\n\n                busy = false;\n                logEl.innerHTML = '';\n                choicesEl.innerHTML = '';\n                updateUI();\n                saveGame(false);\n\n                const ok = await playMessages(scene.messages, myToken);\n                if (!ok || token !== myToken) return;\n\n                await sleep(300);\n                if (token !== myToken) return;\n\n                renderChoices(scene, myToken);\n            }\n\n            function renderChoices(scene, myToken) {\n                choicesEl.innerHTML = '';\n                scene.choices.forEach((choice, index) => {\n                    if (token !== myToken) return;\n                    const btn = document.createElement('button');\n                    btn.className = 'choice-btn';\n                    btn.style.animationDelay = (index * 80) + 'ms';\n                    btn.innerHTML = `<span class=\"choice-index\">OPTION ${String(index + 1).padStart(2, '0')}</span>${withName(choice.text)}`;\n                    btn.addEventListener('click', () => handleChoice(scene, choice, index, myToken));\n                    choicesEl.appendChild(btn);\n                });\n            }\n\n            async function handleChoice(scene, choice, index, myToken) {\n                if (busy || token !== myToken) return;\n                busy = true;\n                choicesEl.innerHTML = '';\n\n                const eff = choice.effects;\n                state.fav = clamp(state.fav + (eff.fav || 0), 0, 100);\n                state.trust = clamp(state.trust + (eff.trust || 0), 0, 100);\n                state.boundary = clamp(state.boundary + (eff.boundary || 0), 0, 100);\n                state.violation = clamp(state.violation + (eff.violation || 0), 0, 3);\n                state.ledger = clamp(state.ledger + (eff.ledger || 0), 0, 3);\n                updateUI();\n\n                const playerDiv = document.createElement('div');\n                playerDiv.className = 'message speaker-player';\n                const ps = document.createElement('div');\n                ps.className = 'msg-speaker player';\n                ps.textContent = state.name;\n                const pt = document.createElement('div');\n                pt.className = 'msg-text player';\n                pt.textContent = withName(choice.text);\n                playerDiv.appendChild(ps);\n                playerDiv.appendChild(pt);\n                logEl.appendChild(playerDiv);\n                scrollLog();\n   window.backToLobby = function () {
    Object.keys(roots).forEach(function (key) {
      var root = roots[key];
      if (root.classList.contains('on')) {
        if (window.__GAMES[key] && window.__GAMES[key].leave) {
          window.__GAMES[key].leave();
        }
        root.classList.remove('on');
      }
    });

    yzwBack.classList.remove('on');
    lobby.scrollTop = 0;
  };
