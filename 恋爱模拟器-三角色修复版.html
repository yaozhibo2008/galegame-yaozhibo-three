  /* ---------------- 常量 / 状态 ---------------- */
  var SAVE_KEY = 'yaozhiguo_save_v1';
  var TYPE_SPEED = 24;

  var state = null;
  var token = 0;
  var skipFlag = false;
  var busy = false;
  var gender = '其他';
  var toastTimer = null;

  var el = function (id) { return document.getElementById('yzg-' + id); };
  var screenStart = el('screen-start');
  var screenGame  = el('screen-game');
  var screenEnd   = el('screen-end');
  var logEl       = el('log');
  var choicesEl   = el('choices');

  /* ---------------- 工具 ---------------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fillName(t) { return String(t).replace(/\{name\}/g, state ? state.name : '你'); }

  function showScreen(s) {
    [screenStart, screenGame, screenEnd].forEach(function (n) { n.classList.remove('active'); });
    s.classList.add('active');
  }

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1500);
  }

  function scrollBottom() { logEl.scrollTop = logEl.scrollHeight; }

  /* ---------------- 数值 ---------------- */
  function renderStats() {
    if (!state) return;
    el('v-fav').textContent  = state.fav;
    el('v-dep').textContent  = state.dep;
    el('v-cool').textContent = state.cool;
    el('fill-fav').style.width  = clamp(state.fav, 0, 100) + '%';
    el('fill-dep').style.width  = clamp(state.dep, 0, 100) + '%';
    el('fill-cool').style.width = clamp(state.cool, 0, 100) + '%';
  }

  /* ---------------- 打字机 ---------------- */
  function typeMessage(msg, myToken) {
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'yzg-msg ' + (msg.who ? 'yzg-msg-dialog' : 'yzg-msg-narration');

      if (msg.who) {
        var s = document.createElement('div');
        s.className = 'yzg-speaker';
        s.textContent = msg.who;
        wrap.appendChild(s);
      }
      var p = document.createElement('p');
      p.className = 'yzg-line';
      wrap.appendChild(p);

      logEl.appendChild(wrap);
      scrollBottom();

      var full = fillName(msg.text);
      var i = 0;
      skipFlag = false;

      function step() {
        if (myToken !== token) { resolve(false); return; }

        if (skipFlag) {
          p.textContent = full;
          scrollBottom();
          resolve(true);
          return;
        }

        if (i >= full.length) { resolve(true); return; }

        i++;
        p.textContent = full.slice(0, i);

        if (i % 3 === 0) scrollBottom();

        setTimeout(step, TYPE_SPEED);
      }
      step();
    });
  }

  function appendPlayerLine(text) {
    var wrap = document.createElement('div');
    wrap.className = 'yzg-msg yzg-msg-player';
    var s = document.createElement('div');
    s.className = 'yzg-speaker yzg-speaker-player';
    s.textContent = state.name;
    var p = document.createElement('p');
    p.className = 'yzg-line';
    p.textContent = text;
    wrap.appendChild(s);
    wrap.appendChild(p);
    logEl.appendChild(wrap);
    scrollBottom();
  }

  /* ---------------- 流程 ---------------- */
  function newState(name, g) {
    return { name: name, gender: g, fav: 0, dep: 0, cool: 60, scene: 's1' };
  }

  function startGame(name, g) {
    state = newState(name, g);
    token++;
    logEl.innerHTML = '';
    choicesEl.innerHTML = '';
    renderStats();
    showScreen(screenGame);
    playScene('s1');
  }

  async function playScene(sceneId) {
    var myToken = ++token;
    var scene = SCENES[sceneId];
    if (!scene) { showEnding(); return; }

    state.scene = sceneId;
    busy = false;
    choicesEl.innerHTML = '';
    logEl.innerHTML = '';
    renderStats();
    saveGame(false);

    for (var i = 0; i < scene.messages.length; i++) {
      var ok = await typeMessage(scene.messages[i], myToken);
      if (!ok || myToken !== token) return;
      await sleep(160);
      if (myToken !== token) return;
    }

    await sleep(180);
    if (myToken !== token) return;

    renderChoices(scene, myToken);
  }

  function renderChoices(scene, myToken) {
    choicesEl.innerHTML = '';
    scene.choices.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'yzg-choice';
      b.style.animationDelay = (i * 70) + 'ms';
      b.textContent = fillName(c.text);
      b.addEventListener('click', function () { pickChoice(scene, c, myToken); });
      choicesEl.appendChild(b);
    });
    setTimeout(scrollBottom, 60);
  }

  async function pickChoice(scene, choice, myToken) {
    if (busy) return;
    if (myToken !== token) return;
    busy = true;

    choicesEl.innerHTML = '';
    appendPlayerLine(fillName(choice.text));

    state.fav  = clamp(state.fav  + (choice.fav  || 0), 0, 100);
    state.dep  = clamp(state.dep  + (choice.dep  || 0), 0, 100);
    state.cool = clamp(state.cool + (choice.cool || 0), 0, 100);
    renderStats();

    await sleep(320);
    if (myToken !== token) return;

    for (var i = 0; i < choice.replies.length; i++) {
      var ok = await typeMessage(choice.replies[i], myToken);
      if (!ok || myToken !== token) return;
      await sleep(150);
      if (myToken !== token) return;
    }

    saveGame(false);

    await sleep(520);
    if (myToken !== token) return;

    if (scene.next) { playScene(scene.next); }
    else { showEnding(); }
  }

  /* ---------------- 结局 ---------------- */
  function showEnding() {
    token++;
    busy = true;

    var fav = state.fav;
    var dep = state.dep;
    var cool = state.cool;

    var title = '';

    var honorific = state.gender === '男' ? '哥哥' : '姐姐';

    if (fav >= 70 && dep >= 60) {
      title = '恋人结局 · 他终于叫了你的名字';
      html =

        '<p>「……家人不都这样。」</p>' +
        '<p>你成了他唯一信任的人。这样也很好。</p>';
    } else {
      title = '路人结局 · 没有名字的过客';
      html =
        '<p>姚智博转学去了南方。</p>' +
        '<p>他的座位空了。桌肚里什么都没有留下，干净得像从来没有人坐过。</p>' +

        '<p>黑发，白色卫衣，话很少。有人问他为什么不换个热闹点的风格。</p>' +
        '<p>「……懒得。」</p>' +
        '<p>你看了很久，最后关掉了页面。</p>' +
        '<p>你只是他生命里，一个没有名字的路过。</p>';
    }

    el('end-title').textContent = title;
    el('end-text').innerHTML = html;
    el('end-stats').innerHTML =
      '<div class="yzg-end-stat">好感度<b>' + fav + '</b></div>' +
      '<div class="yzg-end-stat">依赖度<b>' + dep + '</b></div>' +
      '<div class="yzg-end-stat">高冷值<b>' + cool + '</b></div>';

    clearSave();
    refreshContinue();
    showScreen(screenEnd);
  }

  /* ---------------- 存档（独立前缀） ---------------- */
  function saveGame(manual) {
    if (!state) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      if (manual) toast('已存档');
    } catch (e) {
      if (manual) toast('存档失败');
    }
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  function refreshContinue() {
    el('btn-continue').style.display = hasSave() ? 'block' : 'none';
  }

  function loadGame() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (!raw) { toast('没有找到存档'); return; }

    var d;
    try { d = JSON.parse(raw); } catch (e) { toast('存档已损坏'); return; }
    if (!d || !d.scene || !SCENES[d.scene]) { toast('存档已损坏'); return; }

    state = {
      name: d.name || '你',
      gender: d.gender || '其他',
      fav: typeof d.fav === 'number' ? d.fav : 0,
      dep: typeof d.dep === 'number' ? d.dep : 0,
      cool: typeof d.cool === 'number' ? d.cool : 60,
      scene: d.scene
    };

    showScreen(screenGame);
    renderStats();
    playScene(state.scene);
    toast('已读档');
  }

  function resetToStart() {
    token++;
    busy = false;
    state = null;
    logEl.innerHTML = '';
    choicesEl.innerHTML = '';
    el('input-name').value = '';
    showScreen(screenStart);
    refreshContinue();
  }

  /* ---------------- 事件绑定 ---------------- */
  document.querySelectorAll('#yzg .yzg-gender-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#yzg .yzg-gender-btn').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      gender = b.dataset.g;
    });
  });

  el('btn-start').addEventListener('click', function () {
    var n = el('input-name').value.trim() || '你';
    startGame(n, gender);
  });

  el('input-name').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el('btn-start').click();
  });

  el('btn-continue').addEventListener('click', loadGame);

  el('btn-save').addEventListener('click', function () {
    if (!state) return;
    saveGame(true);
  });

  el('btn-load').addEventListener('click', function () {
    if (!hasSave()) { toast('没有找到存档'); return; }
    loadGame();
  });

  el('btn-restart').addEventListener('click', function () {
    if (!window.confirm('确定要重新开始吗？当前进度会丢失。')) return;
    clearSave();
    resetToStart();
  });

  el('btn-again').addEventListener('click', function () {

  });

  el('btn-lobby').addEventListener('click', function () {
    if (state && !window.confirm('返回选角大厅？当前进度已自动保存。')) return;
    window.backToLobby();
  });

  /* 点击对话区跳过打字 */
  logEl.addEventListener('click', function () { skipFlag = true; });

  /* ---------------- 对外接口 ---------------- */
  window.__GAMES.yzg = {
    enter: function () {
      token++;
      busy = false;
      state = null;
      logEl.innerHTML = '';
      choicesEl.innerHTML = '';
      el('input-name').value = '';
      showScreen(screenStart);
      refreshContinue();
    },
    leave: function () {
      token++;
      busy = false;
    }
  };

  /* ---------------- 初始化 ---------------- */
  refreshContinue();

})();

      { "id": "c08_1", "scene_id": "scene_08", "text": "主动解释：“我只在意你。”", "effect_id": "e08_1", "next_scene": "scene_09" },

      { "id": "c08_3", "scene_id": "scene_08", "text": "给他空间，等他开口。", "effect_id": "e08_3", "next_scene": "scene_09" },
      { "id": "c09_1", "scene_id": "scene_09", "text": "“那你觉得谁行？”", "effect_id": "e09_1", "next_scene": "scene_10" },
      { "id": "c09_2", "scene_id": "scene_09", "text": "“你在吃醋吗，姚智博？”", "effect_id": "e09_2", "next_scene": "scene_10" },
      { "id": "c09_3", "scene_id": "scene_09", "text": "“先放开我，我听听你怎么说。”", "effect_id": "e09_3", "next_scene": "scene_10" },
      { "id": "c10_1", "scene_id": "scene_10", "text": "“姚智博，我喜欢你。不是玩笑。”", "effect_id": "e10_1", "next_scene": "ending_check" },
      { "id": "c10_2", "scene_id": "scene_10", "text": "“你如果不喜欢，我就当没来过。”", "effect_id": "e10_2", "next_scene": "ending_check" },
      { "id": "c10_3", "scene_id": "scene_10", "text": "“先下播，我有话单独说。”", "effect_id": "e10_3", "next_scene": "ending_check" }
    ],
    "effects": [
      { "id": "e01_1", "affection": 4, "tsundere": -3, "trust": 2 },
      { "id": "e01_2", "affection": 2, "tsundere": 5, "trust": 1 },
      { "id": "e01_3", "affection": 3, "tsundere": -1, "trust": 3 },

      { "id": "e02_2", "affection": 4, "tsundere": -2, "trust": 3 },
      { "id": "e02_3", "affection": 3, "tsundere": 6, "trust": 0 },
      { "id": "e03_1", "affection": 5, "tsundere": -5, "trust": 4 },
      { "id": "e03_2", "affection": 3, "tsundere": 5, "trust": 1 },
      { "id": "e03_3", "affection": 4, "tsundere": -2, "trust": 3 },
      { "id": "e04_1", "affection": 6, "tsundere": -4, "trust": 5 },
      { "id": "e04_2", "affection": 4, "tsundere": 6, "trust": 2 },

      { "id": "e05_1", "affection": 4, "tsundere": 7, "trust": 1 },
      { "id": "e05_2", "affection": 6, "tsundere": -5, "trust": 5 },
      { "id": "e05_3", "affection": 3, "tsundere": 1, "trust": 2 },

      { "id": "e06_2", "affection": 5, "tsundere": -6, "trust": 4 },
      { "id": "e06_3", "affection": 4, "tsundere": 8, "trust": 1 },
      { "id": "e07_1", "affection": 5, "tsundere": -2, "trust": 3 },
      { "id": "e07_2", "affection": 3, "tsundere": 6, "trust": 1 },
      { "id": "e07_3", "affection": 7, "tsundere": -4, "trust": 3 },
      { "id": "e08_1", "affection": 7, "tsundere": -5, "trust": 6 },
      { "id": "e08_2", "affection": 4, "tsundere": 7, "trust": 2 },
      { "id": "e08_3", "affection": 2, "tsundere": 1, "trust": 3 },
      { "id": "e09_1", "affection": 7, "tsundere": 4, "trust": 4 },
      { "id": "e09_2", "affection": 5, "tsundere": 8, "trust": 2 },
      { "id": "e09_3", "affection": 4, "tsundere": -3, "trust": 6 },
      { "id": "e10_1", "affection": 10, "tsundere": -6, "trust": 8 },
      { "id": "e10_2", "affection": 5, "tsundere": 3, "trust": 5 },
      { "id": "e10_3", "affection": 7, "tsundere": -2, "trust": 7 }
    ],
    "endings": [
      {
        "id": "ending_lover",
        "name": "恋人结局",
        "priority": 1,
        "condition": "affection >= 60 && trust >= 45 && tsundere <= 45",
        "text": "{player_name}，直播结束后，姚智博别过脸，把礼物盒塞回你手里：“别误会，我只是刚好也喜欢你。你要是敢反悔，我就再也不理你了。”他耳尖通红，却牵住了你的手。恋人结局。"
      },
      {
        "id": "ending_friend",
        "name": "朋友结局",
        "priority": 2,
        "condition": "affection >= 40 && trust >= 30",
        "text": "姚智博嘴上说着“只是朋友”，却记得你所有偏好。你们成了彼此最信任的朋友，只是他偶尔会在直播里看着你的ID发呆。朋友结局。"
      },
      {
        "id": "ending_missed",
        "name": "错过结局",
        "priority": 3,
        "condition": "true",
        "text": "姚智博依然嘴硬，依然在直播里假装不在意。可当你转身离开，他伸出的手停在半空。你们错过了。错过结局。"
      }
    ]
  };

  /* ===================== 常量与状态 ===================== */
  var SAVE_KEY = 'yaozhibo_save_v1';
  var MAX = { affection: 70, tsundere: 100, trust: 55 };
  var TYPE_SPEED = 18;

  var state = null;
  var session = 0;
  var skipCurrent = false;
  var locked = false;
  var selectedGender = '其他';
  var toastTimer = null;

  var $ = function (id) { return document.getElementById('yzb-' + id); };
  var screens = {
    start: $('start-screen'),
    game: $('game-screen'),
    ending: $('ending-screen')
  };
  var dialogEl = $('dialog');
  var choicesEl = $('choices');
  var stageEl = $('stage');

  /* ===================== 工具函数 ===================== */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function fmt(n) { return (n > 0 ? '+' : '') + n; }
  function numOr(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }

  function showScreen(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function fill(text) {
    return String(text)
      .replace(/\{player_name\}/g, state ? state.name : '你')
      .replace(/\{player_gender\}/g, state ? state.gender : '其他');
  }

  /* ===================== 打字机 ===================== */
  async function typeText(text, cls, my) {
    skipCurrent = false;
    var p = document.createElement('p');
    if (cls) p.className = cls;
    dialogEl.appendChild(p);
    stageEl.scrollTop = stageEl.scrollHeight;

    var chars = Array.from(text);
    for (var i = 0; i < chars.length; i++) {
      if (my !== session) return false;
      if (skipCurrent) { p.textContent = text; skipCurrent = false; break; }
      p.textContent += chars[i];
      if (i % 4 === 0) stageEl.scrollTop = stageEl.scrollHeight;
      await sleep(TYPE_SPEED);
    }
    p.textContent = text;
    stageEl.scrollTop = stageEl.scrollHeight;
    return true;
  }

  /* ===================== 数值 ===================== */
  function setStat(key, val, max) {
    var numEl = $('num-' + key);
    var barEl = $('bar-' + key);
    if (numEl) numEl.textContent = val;
    if (barEl) barEl.style.width = clamp((val / max) * 100, 0, 100) + '%';
  }

  function updateStats() {
    if (!state) return;
    setStat('affection', state.affection, MAX.affection);
    setStat('tsundere', state.tsundere, MAX.tsundere);
    setStat('trust', state.trust, MAX.trust);
  }

  /* ===================== 存档（独立前缀） ===================== */
  function saveGame(manual) {
    if (!state) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      if (manual) toast('已存档 ✓');
    } catch (e) {
      if (manual) toast('存档失败');
    }
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  function refreshContinue() {
    $('continue-btn').hidden = !hasSave();
  }

  function loadGame() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (!raw) { toast('没有找到存档'); return; }

    var d = null;
    try { d = JSON.parse(raw); } catch (e) { toast('存档已损坏'); return; }
    if (!d || !d.currentScene) { toast('存档已损坏'); return; }

    state = {
      name: d.name || '你',
      gender: d.gender || '其他',
      affection: numOr(d.affection, DATA.initial_stats.affection),
      tsundere: numOr(d.tsundere, DATA.initial_stats.tsundere),
      trust: numOr(d.trust, DATA.initial_stats.trust),
      currentScene: d.currentScene
    };
    locked = false;
    showScreen('game');
    updateStats();
    playScene(state.currentScene);
    toast('已读档 ✓');
  }

  /* ===================== 流程 ===================== */
  function startGame(name, gender) {
    state = {
      name: name,
      gender: gender,
      affection: DATA.initial_stats.affection,
      tsundere: DATA.initial_stats.tsundere,
      trust: DATA.initial_stats.trust,
      currentScene: DATA.scenes[0].id
    };
    locked = false;
    showScreen('game');
    updateStats();
    playScene(state.currentScene);
  }

  async function playScene(sceneId) {
    var my = ++session;
    var scene = DATA.scenes.filter(function (s) { return s.id === sceneId; })[0];
    if (!scene) { showEnding(); return; }

    state.currentScene = sceneId;
    locked = false;
    choicesEl.innerHTML = '';
    dialogEl.innerHTML = '';
    $('scene-label').textContent = scene.title;
    updateStats();
    saveGame(false);
    stageEl.scrollTop = 0;

    await typeText(fill(scene.text), 'yzb-narration', my);
    if (my !== session) return;

    await sleep(240);
    if (my !== session) return;

    await typeText(fill(scene.tsundere_exposure), 'yzb-tsundere-line', my);
    if (my !== session) return;

    await sleep(180);
    if (my !== session) return;

    renderChoices(scene, my);
  }

  function renderChoices(scene, my) {
    choicesEl.innerHTML = '';
    scene.choices.forEach(function (cid, i) {
      var c = DATA.choices.filter(function (x) { return x.id === cid; })[0];
      if (!c) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'yzb-choice-btn';
      btn.style.animationDelay = (i * 60) + 'ms';
      btn.textContent = c.text;
      btn.addEventListener('click', function () { handleChoice(c, my); });
      choicesEl.appendChild(btn);
    });
  }

  async function handleChoice(choice, my) {
    if (locked) return;
    if (my !== session) return;
    locked = true;

    choicesEl.innerHTML = '';

    var eff = DATA.effects.filter(function (e) { return e.id === choice.effect_id; })[0] || {};
    var dA = eff.affection || 0;
    var dT = eff.tsundere || 0;
    var dR = eff.trust || 0;

    state.affection = clamp(state.affection + dA, 0, MAX.affection);
    state.tsundere = clamp(state.tsundere + dT, 0, MAX.tsundere);
    state.trust = clamp(state.trust + dR, 0, MAX.trust);
    updateStats();

    await typeText('▶ ' + choice.text, 'yzb-player-line', my);
    if (my !== session) return;

    var tips = [];
    if (dA) tips.push('好感度 ' + fmt(dA));
    if (dT) tips.push('傲娇值 ' + fmt(dT));
    if (dR) tips.push('信任 ' + fmt(dR));
    if (tips.length) {
      await typeText(tips.join('　'), 'yzb-effect-tip', my);
      if (my !== session) return;
    }

    await sleep(420);
    if (my !== session) return;

    if (choice.next_scene === 'ending_check') { showEnding(); }
    else { playScene(choice.next_scene); }
  }

  /* ===================== 结局 ===================== */
  function checkCond(cond, stats) {
    try {
      var fn = new Function('affection', 'tsundere', 'trust', 'return (' + cond + ');');
      return !!fn(stats.affection, stats.tsundere, stats.trust);
    } catch (e) {
      return false;
    }
  }

  function showEnding() {
    session++;
    var stats = { affection: state.affection, tsundere: state.tsundere, trust: state.trust };

    var sorted = DATA.endings.slice().sort(function (a, b) { return a.priority - b.priority; });
    var chosen = sorted[sorted.length - 1];
    for (var i = 0; i < sorted.length; i++) {
      if (checkCond(sorted[i].condition, stats)) { chosen = sorted[i]; break; }
    }

    $('ending-name').textContent = chosen.name;
    $('ending-text').textContent = fill(chosen.text);
    $('ending-stats').innerHTML =
      '<div>好感度<b>' + stats.affection + '</b></div>' +
      '<div>傲娇值<b>' + stats.tsundere + '</b></div>' +
      '<div>信任<b>' + stats.trust + '</b></div>';

    showScreen('ending');
    clearSave();
    refreshContinue();
  }

  /* ===================== 事件绑定 ===================== */
  document.querySelectorAll('#yzb .yzb-gender-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#yzb .yzb-gender-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selectedGender = btn.dataset.gender || '其他';
    });
  });

  $('start-btn').addEventListener('click', function () {
    var name = $('name-input').value.trim() || '你';
    startGame(name, selectedGender);
  });

  $('continue-btn').addEventListener('click', function () { loadGame(); });

  $('save-btn').addEventListener('click', function () { saveGame(true); });
  $('load-btn').addEventListener('click', function () { loadGame(); });

  $('restart-btn').addEventListener('click', function () {
    if (!window.confirm('确定要重新开始吗？当前进度将会丢失。')) return;
    session++;
    clearSave();
    state = null;
    refreshContinue();
    dialogEl.innerHTML = '';
    choicesEl.innerHTML = '';
    $('name-input').value = '';
    showScreen('start');
  });

  $('ending-restart').addEventListener('click', function () {
    session++;
    state = null;
    refreshContinue();
    dialogEl.innerHTML = '';
    choicesEl.innerHTML = '';
    $('name-input').value = '';
    showScreen('start');
  });

  $('lobby-btn').addEventListener('click', function () {
    if (state && !window.confirm('返回选角大厅？当前进度已自动保存。')) return;
    window.backToLobby();
  });

  stageEl.addEventListener('click', function () { skipCurrent = true; });

  $('name-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { $('start-btn').click(); }
  });

  /* ===================== 对外接口 ===================== */
  window.__GAMES.yzb = {
    enter: function () {
      session++;
      locked = false;
      state = null;
      dialogEl.innerHTML = '';
      choicesEl.innerHTML = '';
      $('name-input').value = '';
      showScreen('start');
      refreshContinue();
    },
    leave: function () {
      session++;
      locked = false;
    }
  };

  /* ===================== 初始化 ===================== */
  refreshContinue();

})();
</script>
